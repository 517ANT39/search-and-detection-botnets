syntax = "proto3";

package traffic;

import "common.proto";
import "host_info.proto";

option go_package = "traffic-agent/gen/traffic";

message RegisterResponse {
    bool   ok      = 1;
    string message = 2;
}

message PacketEvent {
    uint64    timestamp_ns = 1;
    fixed32   src_ip       = 2;
    fixed32   dst_ip       = 3;
    uint32    src_port     = 4;
    uint32    dst_port     = 5;
    uint32    pkt_len      = 6;
    Protocol    protocol     = 7;
    HookType  hook         = 8;
    Direction direction    = 9;
    uint32    ifindex      = 10;
}

message PacketBatch {
    string host_id              = 1;
    int64  batch_ts             = 2;
    repeated PacketEvent events = 3;
}

message BatchResponse {
    bool   ok             = 1;
    uint64 received_count = 2;
}

service TrafficCollector {
    rpc RegisterHost    (HostInfo)    returns (RegisterResponse);
    rpc SendPacketBatch (PacketBatch) returns (BatchResponse);
}
